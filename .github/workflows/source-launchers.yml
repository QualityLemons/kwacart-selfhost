name: Native source launchers
on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.py'
      - requirements.txt
      - Start KwaCart.bat
      - Start KwaCart.command
      - .github/workflows/source-launchers.yml
  pull_request:
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'QualityLemons/kwacart-selfhost'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-15]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test terminal driver only (not application dependencies)
        run: python -m pip install "pexpect==4.9.0; sys_platform != 'win32'" "pywinpty==3.0.2; sys_platform == 'win32'"
      - name: Build clean source ZIP
        run: python scripts/build_source_release.py
      - name: Check extracted source using real private-runtime installation
        run: python scripts/native_source_check.py dist/kwacart-source.zip
      # No upload-artifact step: keys, cookies, databases and terminal transcripts
      # are private temporary test state, not release or diagnostic artifacts.
