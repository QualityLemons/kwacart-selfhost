name: Standalone desktop packages
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish tested packages as a public preview release
        type: boolean
        default: false
      tag:
        description: New release tag (for example desktop-v1.0.0)
        type: string
        default: desktop-v1.0.0
  push:
    paths:
      - desktop/**
      - packaging/**
      - scripts/*desktop*.py
      - .github/workflows/desktop.yml
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'QualityLemons/kwacart-selfhost'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            executable: dist/KwaCart/KwaCart.exe
          - os: macos-15-intel
            platform: macos-intel
            executable: dist/KwaCart.app/Contents/MacOS/KwaCart
          - os: macos-15
            platform: macos-apple-silicon
            executable: dist/KwaCart.app/Contents/MacOS/KwaCart
          - os: ubuntu-22.04
            platform: linux-x64
            executable: dist/KwaCart/KwaCart
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native build dependencies
        run: python -m pip install -r packaging/requirements-desktop.txt -r packaging/requirements-build.txt
      - name: Retrieve native runtime notices
        run: python scripts/fetch_native_notices.py
      - name: Build from clean corresponding source
        run: python scripts/build_desktop.py
      - name: Native package checks (Windows and macOS)
        if: runner.os != 'Linux'
        run: python scripts/native_desktop_check.py "${{ matrix.executable }}"
      - name: Native package checks (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/native_desktop_check.py "${{ matrix.executable }}"
      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/KwaCart -DestinationPath "dist/KwaCart-${{ matrix.platform }}.zip"
      - name: Archive Mac app (preserve executable bits and symlinks)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/KwaCart.app "dist/KwaCart-${{ matrix.platform }}.zip"
      - name: Archive Linux app
        if: runner.os == 'Linux'
        run: tar -czf "dist/KwaCart-${{ matrix.platform }}.tar.gz" -C dist KwaCart
      - uses: actions/upload-artifact@v4
        with:
          name: KwaCart-${{ matrix.platform }}
          path: |
            dist/KwaCart-*.zip
            dist/KwaCart-*.tar.gz
            dist/kwacart-source.zip
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.repository == 'QualityLemons/kwacart-selfhost'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum KwaCart-* kwacart-source.zip > SHA256SUMS.txt
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: QualityLemons/kwacart-selfhost
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "$TAG" release/* --target "$COMMIT" --prerelease \
            --title "KwaCart desktop preview" \
            --notes "Free standalone local packages. Python is bundled; no cloud account is required. Native automated checks passed on Windows, Intel Mac, Apple silicon Mac and Linux. Unsigned preview: platform security warnings may appear. Read docs/DESKTOP_RELEASES.md before opening. Preserve your per-user data folder when updating. Source and third-party notices are included."
